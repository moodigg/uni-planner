<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Uni Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
    </span>
    <span class="brand-name">Uni Planner</span>
  </div>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" id="tab-reminders" role="tab" aria-label="Reminders" aria-selected="true" aria-controls="panel-reminders" type="button">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
      <span>Reminders</span>
      <span class="tab-count" id="tab-count-reminders" hidden></span>
    </button>
    <button class="tab" id="tab-schedule" role="tab" aria-label="Schedule" aria-selected="false" aria-controls="panel-schedule" type="button" tabindex="-1">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Schedule</span>
    </button>
  </nav>

  <div class="header-actions">
    <button class="icon-btn" id="btn-theme" type="button" aria-label="Switch to light theme" title="Switch theme">
      <svg class="ic ic-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
      <svg class="ic ic-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="icon-btn" id="btn-data" type="button" aria-label="Data options" aria-haspopup="true" aria-expanded="false" title="Data">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
      <div class="menu" id="menu-data" hidden role="menu" aria-labelledby="btn-data">
        <button class="menu-item" type="button" role="menuitem" data-action="export">Export backup (.json)</button>
        <button class="menu-item" type="button" role="menuitem" data-action="import">Import backup&hellip;</button>
        <button class="menu-item danger" type="button" role="menuitem" data-action="wipe">Erase all data</button>
      </div>
    </div>
  </div>
</header>

<main id="main">
  <!-- ============ REMINDERS ============ -->
  <section id="panel-reminders" role="tabpanel" aria-labelledby="tab-reminders" tabindex="-1">
    <form class="capture" id="capture-form" autocomplete="off">
      <label class="capture-label" for="capture-input">Quick capture</label>
      <div class="capture-row">
        <svg class="ic capture-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <input id="capture-input" name="capture" type="text" placeholder="Exam CS210 sunday ch 3-5"
               aria-describedby="capture-help capture-preview">
        <button class="btn btn-primary" type="submit">Add</button>
      </div>
      <p class="capture-help" id="capture-help">Type it the way you heard it &mdash; dates, course codes and chapters are picked up automatically.</p>
      <div class="capture-preview" id="capture-preview" aria-live="polite" hidden></div>
    </form>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="search-input">Search reminders</label>
        <input id="search-input" type="search" placeholder="Search&hellip;">
      </div>
      <div class="chips" role="group" aria-label="Filter by type">
        <button class="chip is-on" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-filter="exam" aria-pressed="false">Exams</button>
        <button class="chip" type="button" data-filter="assignment" aria-pressed="false">Assignments</button>
        <button class="chip" type="button" data-filter="quiz" aria-pressed="false">Quizzes</button>
        <button class="chip" type="button" data-filter="project" aria-pressed="false">Projects</button>
        <button class="chip" type="button" data-filter="note" aria-pressed="false">Notes</button>
      </div>
      <label class="switch">
        <input type="checkbox" id="show-done">
        <span>Show done</span>
      </label>
    </div>

    <div id="reminder-list" class="groups"></div>
  </section>

  <!-- ============ SCHEDULE ============ -->
  <section id="panel-schedule" role="tabpanel" aria-labelledby="tab-schedule" tabindex="-1" hidden>
    <div id="today-strip" class="today-strip"></div>

    <div class="toolbar">
      <div class="chips" role="group" aria-label="Schedule view">
        <button class="chip is-on" type="button" data-view="week" aria-pressed="true">Week grid</button>
        <button class="chip" type="button" data-view="list" aria-pressed="false">Day list</button>
      </div>
      <button class="btn btn-ghost" id="btn-add-class" type="button">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add class
      </button>
    </div>

    <div id="schedule-week" class="week-wrap"></div>
    <div id="schedule-list" class="groups" hidden></div>
  </section>
</main>

<button class="fab" id="fab" type="button" aria-label="Add reminder">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span class="fab-text">New</span>
</button>

<!-- ============ REMINDER DIALOG ============ -->
<dialog id="reminder-dialog" class="sheet" aria-labelledby="reminder-dialog-title">
  <form method="dialog" id="reminder-form">
    <header class="sheet-head">
      <h2 id="reminder-dialog-title">New reminder</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div class="sheet-body">
      <div class="field">
        <label for="r-title">Title</label>
        <input id="r-title" name="title" type="text" required placeholder="Midterm exam">
        <p class="err" data-err-for="r-title" hidden></p>
      </div>

      <fieldset class="field">
        <legend>Type</legend>
        <div class="segmented" id="r-type-group">
          <label><input type="radio" name="type" value="exam"><span class="seg t-exam">Exam</span></label>
          <label><input type="radio" name="type" value="assignment" checked><span class="seg t-assignment">Assignment</span></label>
          <label><input type="radio" name="type" value="quiz"><span class="seg t-quiz">Quiz</span></label>
          <label><input type="radio" name="type" value="project"><span class="seg t-project">Project</span></label>
          <label><input type="radio" name="type" value="note"><span class="seg t-note">Note</span></label>
        </div>
      </fieldset>

      <div class="field-row">
        <div class="field">
          <label for="r-course">Course</label>
          <input id="r-course" name="course" type="text" list="course-list" placeholder="CS210">
          <datalist id="course-list"></datalist>
        </div>
        <div class="field">
          <label for="r-priority">Priority</label>
          <select id="r-priority" name="priority">
            <option value="normal">Normal</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="r-date">Due date</label>
          <input id="r-date" name="date" type="date">
        </div>
        <div class="field">
          <label for="r-time">Time <span class="opt">optional</span></label>
          <input id="r-time" name="time" type="time">
        </div>
      </div>

      <div class="field">
        <label for="r-details">Chapters / details <span class="opt">optional</span></label>
        <textarea id="r-details" name="details" rows="3" placeholder="Chapters 3&ndash;5, no formula sheet, bring calculator"></textarea>
      </div>
    </div>

    <footer class="sheet-foot">
      <button class="btn btn-ghost danger" type="button" id="r-delete" hidden>Delete</button>
      <span class="spacer"></span>
      <button class="btn btn-quiet" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit" value="save">Save</button>
    </footer>
  </form>
</dialog>

<!-- ============ CLASS DIALOG ============ -->
<dialog id="class-dialog" class="sheet" aria-labelledby="class-dialog-title">
  <form method="dialog" id="class-form">
    <header class="sheet-head">
      <h2 id="class-dialog-title">New class</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div class="sheet-body">
      <div class="field-row">
        <div class="field">
          <label for="c-course">Course code</label>
          <input id="c-course" name="course" type="text" required placeholder="CS210">
          <p class="err" data-err-for="c-course" hidden></p>
        </div>
        <div class="field">
          <label for="c-title">Course name <span class="opt">optional</span></label>
          <input id="c-title" name="title" type="text" placeholder="Data Structures">
        </div>
      </div>

      <fieldset class="field">
        <legend>Session type</legend>
        <div class="segmented">
          <label><input type="radio" name="kind" value="lecture" checked><span class="seg t-lecture">Lecture</span></label>
          <label><input type="radio" name="kind" value="lab"><span class="seg t-lab">Lab</span></label>
          <label><input type="radio" name="kind" value="tutorial"><span class="seg t-tutorial">Tutorial</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Days <span class="opt">pick one or more</span></legend>
        <div class="days" id="c-days"></div>
        <p class="err" data-err-for="c-days" hidden></p>
      </fieldset>

      <div class="field-row">
        <div class="field">
          <label for="c-start">Starts</label>
          <input id="c-start" name="start" type="time" required value="09:00">
        </div>
        <div class="field">
          <label for="c-end">Ends</label>
          <input id="c-end" name="end" type="time" required value="09:50">
          <p class="err" data-err-for="c-end" hidden></p>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="c-location">Location</label>
          <input id="c-location" name="location" type="text" placeholder="Building C &mdash; Room 214">
        </div>
        <div class="field">
          <label for="c-instructor">Instructor</label>
          <input id="c-instructor" name="instructor" type="text" placeholder="Dr. Ahmed Salem">
        </div>
      </div>
    </div>

    <footer class="sheet-foot">
      <button class="btn btn-ghost danger" type="button" id="c-delete" hidden>Delete</button>
      <span class="spacer"></span>
      <button class="btn btn-quiet" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit" value="save">Save</button>
    </footer>
  </form>
</dialog>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
